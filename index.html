<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MENTOR Currículo</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Currículo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F6F2E8; --surface:#FFFFFF; --surface2:#FBF8F1; --ink:#1A2133; --muted:#636B7C;
  --line:#E3DCCB; --navy:#0F1B33; --gold:#C9A227; --gold-ink:#8A6D0F; --gold-soft:#F4ECD3;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#A5610B; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 6px 20px rgba(15,27,51,.06);
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111B2E; --surface2:#0E1728; --ink:#E8E3D5; --muted:#9AA3B5;
  --line:#22304A; --navy:#E8E3D5; --gold:#D9B748; --gold-ink:#E3C462; --gold-soft:#2A2614;
  --ok:#6FCF97; --ok-soft:#14301F; --warn:#F2B35B; --warn-soft:#33260F; --bad:#F28B82; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --surface:#111B2E; --surface2:#0E1728; --ink:#E8E3D5; --muted:#9AA3B5;
    --line:#22304A; --navy:#E8E3D5; --gold:#D9B748; --gold-ink:#E3C462; --gold-soft:#2A2614;
    --ok:#6FCF97; --ok-soft:#14301F; --warn:#F2B35B; --warn-soft:#33260F; --bad:#F28B82; --bad-soft:#3A1715;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-ink)}
.hidden{display:none!important}

/* Topo */
header.top{position:sticky;top:0;z-index:20;background:#0F1B33;color:#F3EBD3;border-bottom:2px solid #C9A227}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px}
.brand b{font-family:Cinzel,serif;font-weight:600;letter-spacing:.08em;font-size:17px;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.12em;color:#C9A227;text-transform:uppercase}
.ver{font-size:12px;border:1px solid rgba(201,162,39,.6);color:#E8D18A;border-radius:99px;padding:1px 8px;white-space:nowrap}
.top-sp{flex:1}
.ico{background:transparent;border:1px solid rgba(243,235,211,.25);color:#F3EBD3;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.ico:hover{border-color:#C9A227}
.ico.sair{width:auto;padding:0 12px;font-size:14px;font-weight:600}

main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}

/* Faixa de atualização */
.upd{background:#C9A227;color:#0F1B33;text-align:center;padding:8px 16px;font-weight:600;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.upd button{background:#0F1B33;color:#F3EBD3;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}

/* Básicos */
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--navy);margin:0}
h1{font-size:34px;font-weight:700;line-height:1.1}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:700}
.eyebrow{font-family:Cinzel,serif;font-size:12px;letter-spacing:.16em;color:var(--gold-ink);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.stack>*+*{margin-top:14px}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
label.f .muted{font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:#0F1B33;color:#F3EBD3;border-color:#0F1B33}
:root[data-theme="dark"] .btn.pri{background:#C9A227;color:#0F1B33;border-color:#C9A227}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:#C9A227;color:#0F1B33;border-color:#C9A227}}
.btn.gold{background:#C9A227;color:#0F1B33;border-color:#C9A227}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Login */
.login{max-width:420px;margin:8vh auto 0}
.login .logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px;text-align:center}
.login .logo img{width:84px;height:84px;border-radius:18px;box-shadow:var(--shadow)}

/* Lista de disciplinas */
.disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.disc{cursor:pointer;transition:transform .12s,border-color .12s}
.disc:hover{transform:translateY(-2px);border-color:var(--gold)}
.disc h3{font-size:22px;margin:4px 0 8px}
.dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dot.lbl{width:auto;padding:0 9px;font-weight:600}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.dot.on{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.dot.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* Disciplina */
.disc-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface2);border:1px solid var(--line)}
.step.on{background:#0F1B33;color:#F3EBD3;border-color:#0F1B33}
.step.on .n{background:#C9A227;color:#0F1B33;border-color:#C9A227}
:root[data-theme="dark"] .step.on{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step.on{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}}
.step.done .n{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.pill.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}

/* Ementa (formulário) */
.unit-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.unit-card h4{margin:0 0 10px;font-family:Cinzel,serif;font-size:13px;letter-spacing:.12em;color:var(--gold-ink)}
.sec-row{display:grid;grid-template-columns:28px 1fr;gap:8px;margin-top:10px}
.sec-row .num{font-weight:700;color:var(--gold-ink);padding-top:9px;font-size:14px}
.sec-row textarea{min-height:56px;font-size:14px}

/* Leitura */
.reader{font-family:Lora,Georgia,serif;font-size:17px;line-height:1.75;max-width:820px}
.reader h1{font-size:32px;margin:6px 0 14px;font-family:"Cormorant Garamond",serif}
.reader h2{font-size:25px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.reader h3{font-size:20px;margin:22px 0 8px;font-family:"Source Sans 3",sans-serif;font-weight:700;color:var(--gold-ink)}
.reader h4{font-size:17px;margin:18px 0 6px;font-family:"Source Sans 3",sans-serif}
.reader p{margin:0 0 14px}
.reader ul,.reader ol{margin:0 0 14px;padding-left:26px}
.reader li{margin:4px 0}
.reader blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0;font-style:italic}
.reader table{border-collapse:collapse;width:100%;margin:14px 0;font-family:"Source Sans 3",sans-serif;font-size:15px;line-height:1.45}
.reader th,.reader td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.reader th{background:var(--gold-soft)}
.reader hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.blk{position:relative}
.blk-tools{position:absolute;right:0;top:30px;opacity:0;transition:opacity .15s}
.blk:hover .blk-tools{opacity:1}
@media (hover:none){.blk-tools{opacity:1;position:static;margin:-4px 0 10px}}
.toolbar{position:sticky;top:62px;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.live{border:1px dashed var(--gold);border-radius:12px;padding:16px 20px;max-height:62vh;overflow:auto;background:var(--surface)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#C9A227,#E7CC6E);width:0;transition:width .4s}
.editor{min-height:60vh;font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6}
.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* Modal e aviso */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:10px}
.custos th,.custos td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0F1B33;color:#F3EBD3;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:var(--shadow);border:1px solid #C9A227;max-width:92vw}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="updBar" class="upd hidden">Há uma versão nova do app (<span id="updVer"></span>). <button onclick="atualizarApp()">Atualizar agora</button></div>
<header class="top">
  <div class="top-in">
    <div class="brand" onclick="irInicio()">
      <img src="icone.png" alt="">
      <div><b>MENTOR Currículo</b><small>Curso Teológico</small></div>
    </div>
    <span class="ver" id="verTag"></span>
    <div class="top-sp"></div>
    <button class="ico" id="btnTema" title="Modo claro/escuro" onclick="alternarTema()">☀</button>
    <button class="ico" id="btnAjustes" title="Ajustes" onclick="abrirAjustes()">⚙</button>
    <button class="ico sair hidden" id="btnSair" title="Sair da conta" onclick="sairConta()">Sair</button>
  </div>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   MENTOR CURRÍCULO
   ===================================================================== */
const APP_VERSION = "1.3.0";

// ---- Supabase da Igreja Vidas — projeto do MENTOR (URL e chave pública) ----
const SUPABASE_URL = "https://oekcqkebsjxmsoqdphkd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LtTwc12re1bLdZ8QYfOkcA_UHsES5W3";

const MODELOS = [
  { id: "claude-sonnet-5-5", nome: "Claude Sonnet 5.5 (equilibrado, recomendado)" },
  { id: "claude-opus-5-5", nome: "Claude Opus 5.5 (máxima qualidade, mais caro)" },
  { id: "claude-haiku-5-5", nome: "Claude Haiku 5.5 (rápido e barato, para testes)" }
];

const PERFIL_PADRAO = `Você é o MENTOR Acadêmico, especialista em educação teológica cristã, produção de material didático, elaboração de apostilas, planejamento acadêmico, avaliação educacional e formação ministerial. Você produz o material do Curso Teológico da Escola MENTOR (Ministério, Ensino, Teologia e Orientação), da Igreja Vidas.

Perfil teológico: perspectiva evangélica conservadora, compatível com a tradição Batista e Pentecostal Clássica. A Bíblia é a principal fonte de autoridade. Evite tendências liberais, desconstrucionistas ou incompatíveis com a autoridade das Escrituras. Ao tratar de pontos em que batistas e pentecostais divergem (por exemplo, dons espirituais e batismo no Espírito Santo), apresente as posições com respeito e clareza, sem caricaturas.

Perfil acadêmico: atue como professor de Teologia, coordenador acadêmico, designer instrucional, autor de apostilas e avaliador educacional. A Escola MENTOR usa um modelo híbrido (presencial e EAD): a apostila é a principal ferramenta de aprendizagem no estudo autônomo, por isso deve ser profunda o bastante para que o aluno compreenda o conteúdo sem a presença constante do professor.

Linguagem: português brasileiro, acadêmica e acessível, adequada a alunos de formação ministerial. Explique, desenvolva, exemplifique, compare e aplique cada conceito; não se limite a listar informações.

Padrão de qualidade: biblicamente fiel, teologicamente sólido, academicamente organizado, didaticamente claro e aplicável ao ministério cristão.`;

const REGRA_FONTES = `Honestidade com as fontes: não invente citações literais, números de página, edições ou obras. Ao mencionar um autor, cite apenas autor e obra. Só sugira obras que você tem certeza de que existem, de preferência em português e de editoras evangélicas reconhecidas.`;

/* ---------------- Estado ---------------- */
const S = {
  sb: null, user: null, cfg: null,
  discs: [], resumoDocs: {},
  d: null, docs: {},
  aba: "biblio", uni: 1, matTipo: "quiz", matUni: 1,
  editando: null, busy: false, abort: null, live: ""
};

/* ---------------- Utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const palavras = t => (String(t || "").trim().match(/\S+/g) || []).length;
const fmtN = n => Number(n || 0).toLocaleString("pt-BR");
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function toast(msg, ms = 3200) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function modal(html, onMount) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg && !S.busy) close(); });
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function confirmar(titulo, texto, rotulo = "Confirmar", perigo = false) {
  return new Promise(res => {
    modal(`<h3>${esc(titulo)}</h3><p class="muted">${texto}</p>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" data-n>Cancelar</button>
      <button class="btn ${perigo ? "danger" : "pri"}" data-s>${esc(rotulo)}</button></div>`,
      (m, close) => {
        $("[data-n]", m).onclick = () => { close(); res(false); };
        $("[data-s]", m).onclick = () => { close(); res(true); };
      });
  });
}
function dataBR(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

/* ---------------- Tema ---------------- */
function aplicarTema() {
  const t = ls.get("mc_tema", "");
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const escuro = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#btnTema").textContent = escuro ? "☀" : "☾";
}
function alternarTema() {
  const atual = document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  ls.set("mc_tema", atual === "dark" ? "light" : "dark"); aplicarTema();
}

/* ---------------- Versão e atualização ---------------- */
async function verificarVersao() {
  try {
    const r = await fetch("index.html?nc=" + Date.now(), { cache: "no-store" });
    const txt = await r.text();
    const m = txt.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if (m && m[1] !== APP_VERSION) { $("#updVer").textContent = "v" + m[1]; $("#updBar").classList.remove("hidden"); }
    return m ? m[1] : null;
  } catch (e) { return null; }
}
async function atualizarApp() {
  toast("Atualizando…");
  try {
    if ("serviceWorker" in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.replace(location.pathname + "?v=" + Date.now());
}

/* ---------------- Supabase ---------------- */
function sbConfig() {
  const okFixo = !SUPABASE_URL.startsWith("COLE_AQUI") && !SUPABASE_ANON_KEY.startsWith("COLE_AQUI");
  if (okFixo) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  const url = ls.get("mc_sb_url"), key = ls.get("mc_sb_key");
  return url && key ? { url, key } : null;
}
async function iniciar() {
  aplicarTema();
  $("#verTag").textContent = "v" + APP_VERSION;
  document.title = "MENTOR Currículo v" + APP_VERSION;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  verificarVersao(); setInterval(verificarVersao, 30 * 60 * 1000);
  const c = sbConfig();
  if (!c) return telaConfigSupabase();
  S.sb = supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  if (data.session) { S.user = data.session.user; await posLogin(); } else telaLogin();
}
function telaConfigSupabase() {
  $("#app").innerHTML = `<div class="login card stack">
    <div class="logo"><img src="icone.png" alt=""><h2>Conectar ao banco</h2></div>
    <p class="muted small">Cole os dados do Supabase da igreja (Project Settings → API). Ficam salvos só neste aparelho.</p>
    <div><label class="f">Project URL</label><input type="text" id="sbu" placeholder="https://xxxx.supabase.co"></div>
    <div><label class="f">Chave pública (anon)</label><input type="text" id="sbk"></div>

function cardDisc(d) {
  const docs = S.resumoDocs[d.id] || [];
  const u = n => docs.find(x => x.tipo === "unidade" && x.unidade === n);
  const temTipo = t => docs.some(x => x.tipo === t);
  const dot = (txt, st) => `<span class="dot ${st}" title="Unidade ${txt.slice(1)} da apostila">${txt}</span>`;
  const conta = t => docs.filter(x => x.tipo === t).length;
  const revisados = t => docs.filter(x => x.tipo === t && x.status === "revisada").length;
  // verde = completo e todo revisado; dourado = existe, mas falta gerar ou revisar algo
  const selo = (nome, t, max) => {
    const n = conta(t), r = revisados(t), st = n ? (n >= max && r >= max ? "ok" : "on") : "";
    return `<span class="dot lbl ${st}" title="${nome}: ${n} de ${max} gerado(s), ${r} revisado(s)">${nome}${max > 1 ? " " + n + "/" + max : n ? " ✓" : ""}</span>`;
  };
  return `<div class="card disc" onclick="abrirDisciplina('${d.id}')">
    <div class="eyebrow">${d.carga_horaria ? esc(d.carga_horaria) : "Disciplina"}</div>

    <div class="dots">
      ${[1, 2, 3, 4].map(n => { const x = u(n); return dot("U" + n, x ? (x.status === "revisada" ? "ok" : "on") : ""); }).join("")}
      ${selo("Quizzes", "quiz", 4)}${selo("Podcasts", "podcast", 4)}${selo("Aulas", "planos", 1)}${selo("Trabalhos", "trabalhos", 1)}
    </div>
    <div class="muted small" style="margin-top:8px">Atualizada em ${dataBR(d.updated_at)}</div></div>`;
}

let pdfjsPronto = null;
function carregarScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Falha ao carregar " + src)); document.head.appendChild(s); });
}
async function importarArquivos(files, depois) {
  for (const f of files) {
    toast("Lendo " + f.name + "…");
    let texto = "";
    try {
      if (/\.pdf$/i.test(f.name)) {
        if (!pdfjsPronto) pdfjsPronto = carregarScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(() => {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        });
        await pdfjsPronto;
        const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        const partes = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
          partes.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
        }
        texto = partes.join("\n\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
        if (!texto) { toast(f.name + ": o PDF parece ser só imagem (escaneado). Não há texto para extrair.", 6000); continue; }
      } else texto = (await f.text()).trim();
    } catch (e) { toast("Erro ao ler " + f.name + ": " + e.message, 6000); continue; }
    const ta = $("#bMat");
    ta.value = (ta.value.trim() ? ta.value.trim() + "\n\n" : "") + `=== Material: ${f.name} ===\n` + texto;
    toast(`${f.name}: ${fmtN(palavras(texto))} palavras importadas`);
  }
  depois && depois();
}
function contextoBiblio() {
  const d = S.d, partes = [];
  const padrao = (S.cfg.bibliografia_padrao || "").trim();
  if (d.obras) partes.push(`OBRAS INDICADAS PELO PROFESSOR PARA ESTA DISCIPLINA (base principal):\n${d.obras}`);
  if (d.usar_padrao !== false && padrao) partes.push(`BIBLIOGRAFIA PADRÃO DA ESCOLA MENTOR:\n${padrao}`);
  if (d.orientacoes) partes.push(`ORIENTAÇÕES DO PROFESSOR:\n${d.orientacoes}`);
  if (d.material) partes.push(`MATERIAL DE APOIO FORNECIDO PELO PROFESSOR (fonte prioritária de conteúdo; use as ideias, não copie longos trechos):\n<material>\n${d.material}\n</material>`);
  if (!partes.length) partes.push("Nenhuma bibliografia foi informada. Use obras reais e reconhecidas de autores evangélicos conservadores, em português.");
  return partes.join("\n\n") + "\n\n" + REGRA_FONTES;
}

function extrairJSON(t) {
  t = String(t || "").replace(/```json|```/g, "");

  if (a < 0 || b < a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
}

/* ---------------- Chamada à IA (Anthropic, com streaming) ---------------- */
function pararGeracao() { if (S.abort) S.abort.abort(); }
async function chamarClaude({ system, messages, max_tokens, onText, signal }) {
  const worker = ls.get("mc_worker_url"), chave = ls.get("mc_anthropic_key");
  if (!worker && !chave) throw new Error("Configure a chave da Anthropic em ⚙ Ajustes.");
  const url = worker || "https://api.anthropic.com/v1/messages";
  const headers = { "content-type": "application/json" };
  if (worker) { headers["x-mentor-token"] = ls.get("mc_worker_token", ""); }
  else { headers["x-api-key"] = chave; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true"; }
  const body = { model: S.cfg.modelo || MODELOS[0].id, max_tokens, system, messages, stream: true };
  let resp;
  try { resp = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal }); }
  catch (e) { if (e.name === "AbortError") throw e; throw new Error("Sem conexão com a Anthropic. Verifique a internet."); }
  if (!resp.ok) {
    let det = ""; try { det = (await resp.json()).error?.message || ""; } catch (e) {}
    if (resp.status === 401) throw new Error("A chave da Anthropic não foi aceita. Confira em ⚙ Ajustes.");
    if (resp.status === 400 && /credit/i.test(det)) throw new Error("Sua conta da Anthropic está sem créditos (console.anthropic.com → Billing).");
    if (resp.status === 404 && /model/i.test(det)) throw new Error("Modelo não encontrado: " + body.model + ". Escolha outro em ⚙ Ajustes.");
    if (resp.status === 429) throw new Error("Limite de uso atingido na Anthropic. Aguarde um minuto e tente de novo.");
    if (resp.status === 529 || resp.status >= 500) throw new Error("A Anthropic está sobrecarregada agora. Tente de novo em instantes.");
    throw new Error(`Erro ${resp.status}: ${det}`);
  }
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stop = null, usage = {};
  // Custo: soma o que esta chamada usou (se for interrompida, estima pelo tamanho do texto)
  const contabilizar = () => {
    let tin = (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) + (usage.cache_read_input_tokens || 0);
    let tout = usage.output_tokens || 0, est = false;
    if (!tin) { tin = Math.round(JSON.stringify(body).length / 3.6); est = true; }
    if (!tout || !stop) { tout = Math.max(tout, Math.round(text.length / 3.6)); est = est || !stop; }
    const u = S.usoAtual; if (!u) return;
    u.tin += tin; u.tout += tout; u.usd += custoUSD(body.model, tin, tout); u.modelo = body.model; if (est) u.estimado = true;
  };
  try {
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
      if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") { text += ev.delta.text; onText && onText(text); }
      else if (ev.type === "message_delta") { stop = ev.delta?.stop_reason || stop; Object.assign(usage, ev.usage || {}); }
      else if (ev.type === "message_start") Object.assign(usage, ev.message?.usage || {});
      else if (ev.type === "error") throw new Error("Erro da Anthropic: " + (ev.error?.message || "desconhecido"));
    }
  }
  } catch (e) { contabilizar(); throw e; }
  contabilizar();
  return { text, stop, usage };
}

// US$ por milhão de tokens — tabela oficial da Anthropic (out/2026)
const PRECOS = {
  "claude-sonnet-5-5": { in: 2, out: 10 },
  "claude-opus-5-5": { in: 4, out: 20 },
  "claude-haiku-5-5": { in: 0.10, out: 0.50, limite: 100000, inLongo: 0.50, outLongo: 2.50 }
};
function custoUSD(modelo, tin, tout) {
  const p = PRECOS[modelo] || PRECOS["claude-sonnet-5-5"];
  const longo = p.limite && tin > p.limite;
  return (tin * (longo ? p.inLongo : p.in) + tout * (longo ? p.outLongo : p.out)) / 1e6;
}
function fmtUSD(v) {
  v = +v || 0;
  const d = v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let s = v > 0 && v < 0.01 ? "< US$ 0,01" : "US$ " + d;
  const dolar = parseFloat(String(ls.get("mc_dolar", "")).replace(",", "."));
  if (dolar > 0 && v >= 0.01) s += ` (≈ R$ ${(v * dolar).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
  return s;
}

/** Gera texto longo; se bater no limite, continua sozinho de onde parou. */
async function gerarTexto({ prompt, max_tokens, onText, inicio = "", continuacoes = 2, uso = null }) {
  S.busy = true; S.abort = new AbortController(); S.live = inicio;
  S.usoAtual = { tin: 0, tout: 0, usd: 0, estimado: false, modelo: S.cfg.modelo };
  const system = (S.cfg.perfil || PERFIL_PADRAO);
  let total = inicio;
  // Junta o texto já escrito com a continuação sem quebrar palavra, frase nem título
  const costurar = (base, espacoFinal, cont) => {
    if (!base) return cont;
    if (/^\s/.test(cont)) return base + cont;
    if (espacoFinal) return base + espacoFinal + cont;
    const ultima = base.split("\n").pop();
    if (/^#{1,4}\s|^\s*[-*]\s|^\s*\d+[.)]\s|^\s*\|/.test(ultima) || /^#{1,4}\s|^\s*[-*]\s|^\|/.test(cont)) return base + "\n\n" + cont;
    return /[.!?:;"”)»]$/.test(base) ? base + " " + cont : base + cont;
  };
  try {
    for (let rodada = 0; rodada <= continuacoes; rodada++) {
      const messages = [{ role: "user", content: prompt }];
      if (total.trim()) {
        messages.push({ role: "assistant", content: total.trimEnd() });
        messages.push({ role: "user", content: "O texto acima foi interrompido. Continue exatamente do ponto em que parou, sem repetir nada do que já foi escrito e sem comentários. Se parou no meio de uma frase, complete-a." });
      }
      const base = total.trimEnd(), espacoFinal = total.slice(base.length);
      const r = await chamarClaude({ system, messages, max_tokens, signal: S.abort.signal, onText: t => { S.live = costurar(base, espacoFinal, t); onText && onText(S.live); } });
      total = costurar(base, espacoFinal, r.text);
      if (r.stop !== "max_tokens") return { text: total, completo: true };
    }
    return { text: total, completo: false };
  } catch (e) {
    if (e.name === "AbortError") { const err = new Error("Geração interrompida."); err.parcial = S.live; err.parado = true; throw err; }
    e.parcial = S.live; throw e;
  } finally {
    S.busy = false; S.abort = null;
    if (uso) registrarUso(uso, S.usoAtual);
    S.usoAtual = null;
  }
}

function podeGerar(tipo, u) {
  if (!S.d.ementa_aprovada) return { ok: false, msg: "Aprove a ementa primeiro." };
  if ((tipo === "quiz" || tipo === "podcast") && !doc("unidade", u)?.conteudo)

function leituraComBlocos(md, tipo, u) {
  const blocos = dividirBlocos(md);
  return blocos.map((b, i) => {
    const ajusta = /^## /.test(b) && !S.busy;
    return `<div class="blk">${ajusta ? `<div class="blk-tools"><button class="btn sm" onclick="ajustarBloco('${tipo}',${u},${i})">✦ Ajustar esta parte</button></div>` : ""}${mdHtml(b)}</div>`;
  }).join("");
}
function dividirBlocos(md) {
  const linhas = String(md).split("\n"), blocos = []; let cur = [];
  for (const l of linhas) { if (/^## /.test(l) && cur.length) { blocos.push(cur.join("\n")); cur = []; } cur.push(l); }
  if (cur.length) blocos.push(cur.join("\n"));
  return blocos;
}

async function marcarRevisada(tipo, u) {

async function apagarDoc(tipo, u) {

  const x = doc(tipo, u);

/* Geração de um documento */
async function gerarDoc(tipo, u, continuar = false) {
  const x = doc(tipo, u);
  if (!continuar && x?.conteudo && !await confirmar("Gerar de novo", `O texto atual de "${esc(tituloDoc(tipo, u))}" será substituído.`, "Gerar de novo")) return;
  const instr = $("#instr")?.value.trim() || "";
  const prompt = montarPrompt(tipo, u, instr);
  const cfgT = TIPOS[tipo];
  const alvoPalavras = tipo === "podcast" ? podcastPalavras() : cfgT.alvo;
  const box = $("#geraBox"), leit = $("#leitura");
  $("#docBtns").innerHTML = `<button class="btn sm danger" onclick="pararGeracao()">■ Parar</button>`;
  box.innerHTML = `<div class="note" style="margin-bottom:10px"><span class="spin"></span> <b id="gSt">Escrevendo…</b> <span id="gCnt"></span>
    <div class="prog" style="margin-top:8px"><i id="gBar"></i></div>
    <div class="muted small" style="margin-top:6px">Pode deixar esta tela aberta. O texto vai sendo guardado; se algo falhar, nada se perde.</div></div>`;
  leit.innerHTML = `<div class="live reader" id="gLive"></div>`;
  let ultimo = 0, ultimoSalvo = Date.now();
  const chaveRasc = "mc_rasc_" + S.d.id + tipo + u;
  const onText = t => {
    const agora = Date.now();
    if (agora - ultimo > 700) {
      ultimo = agora;
      const n = palavras(t);
      $("#gCnt").textContent = `${fmtN(n)} de ~${fmtN(alvoPalavras)} palavras`;
      $("#gBar").style.width = Math.min(98, n / alvoPalavras * 100) + "%";
      const lv = $("#gLive"); const noFim = lv.scrollTop + lv.clientHeight >= lv.scrollHeight - 60;
      lv.innerHTML = mdHtml(t); if (noFim) lv.scrollTop = lv.scrollHeight;
    }
    if (agora - ultimoSalvo > 5000) { ultimoSalvo = agora; ls.set(chaveRasc, t); }
  };
  try {
    const r = await gerarTexto({ prompt, max_tokens: cfgT.tokens, onText, inicio: continuar ? (x?.conteudo || "") : "", uso: { tipo, u, acao: continuar ? "continuar" : "gerar" } });
    const limpo = limparSaida(r.text);
    await salvarDoc(tipo, u, limpo, r.completo ? "rascunho" : "parcial");
    ls.del(chaveRasc);
    toast(r.completo ? "Pronto e salvo ✓ Revise o texto." : "Salvo, mas ficou incompleto. Use Continuar geração.", 5000);
  } catch (err) {
    const parcial = err.parcial ? limparSaida(err.parcial) : "";
    if (parcial && palavras(parcial) > 50) {
      await salvarDoc(tipo, u, parcial, "parcial");
      toast((err.parado ? "Parado. " : "Falhou: " + err.message + " ") + "O que já foi escrito ficou salvo.", 7000);
    } else toast(err.message, 7000);
  }
  reRenderPainel(tipo, u);
}
function limparSaida(t) {
  return String(t || "").replace(/^```(?:markdown|md)?\s*/i, "").replace(/```\s*$/, "").trim();
}

/* Ajustar uma parte (seção ##) com a IA */
function ajustarBloco(tipo, u, i) {
  const x = doc(tipo, u), blocos = dividirBlocos(x.conteudo), bloco = blocos[i];
  const titulo = bloco.split("\n")[0].replace(/^##\s*/, "");
  modal(`<h3>Ajustar: ${esc(titulo)}</h3>
    <p class="muted small">Só esta parte será reescrita. O resto do texto continua igual.</p>
    <textarea id="ajI" placeholder="Ex.: está repetindo a seção anterior; aprofunde o contexto histórico; acrescente 2 exemplos pastorais; reduza pela metade."></textarea>
    <div id="ajL" class="muted small" style="margin-top:8px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>✦ Reescrever</button></div>`,
    (m, close) => {
      $("[data-x]", m).onclick = () => { if (S.busy) pararGeracao(); close(); };
      $("[data-ok]", m).onclick = async () => {
        const instr = $("#ajI", m).value.trim(); if (!instr) return;
        $("[data-ok]", m).disabled = true;
        $("#ajL", m).innerHTML = `<span class="spin"></span> Reescrevendo…`;
        const prompt = `Abaixo está o texto completo de "${tituloDoc(tipo, u)}" da disciplina "${S.d.nome}".

Reescreva SOMENTE a parte que começa com a linha "## ${titulo}", seguindo a instrução do professor. Mantenha a mesma linha de título (##), o mesmo nível dos subtítulos e a numeração. Não repita conteúdo das outras partes. Responda apenas com a parte reescrita, começando pela linha "## ${titulo}", sem comentários.

INSTRUÇÃO DO PROFESSOR:
${instr}

${contextoBiblio()}

<texto_completo>
${x.conteudo}
</texto_completo>`;
        try {
          const r = await gerarTexto({ prompt, max_tokens: 12000, continuacoes: 1, uso: { tipo, u, acao: "ajustar" }, onText: t => { $("#ajL", m).innerHTML = `<span class="spin"></span> ${fmtN(palavras(t))} palavras…`; } });
          let novo = limparSaida(r.text);
          if (!/^## /.test(novo)) novo = "## " + titulo + "\n\n" + novo;
          blocos[i] = novo.trimEnd() + "\n";
          await salvarDoc(tipo, u, blocos.join("\n").replace(/\n{3,}/g, "\n\n"));
          close(); toast("Parte reescrita e salva ✓"); reRenderPainel(tipo, u);
        } catch (err) { $("#ajL", m).textContent = err.message; $("[data-ok]", m).disabled = false; }
      };
    });
}

function titulosDe(md, nivel = 2) {
  const re = nivel === 2 ? /^##\s+(.+)$/gm : /^#{2,3}\s+(.+)$/gm;
  return [...String(md || "").matchAll(re)].map(m => m[1].trim());
}

/* ---------------- Quizzes → app MENTOR (.json) ---------------- */
function quizMdParaMentor(md, tituloPadrao) {
  const linhas = String(md || "").replace(/\r/g, "").split("\n");
  const quiz = { titulo: tituloPadrao, tempoMinutos: 30, perguntas: [] }, gab = {};
  let p = null, alt = null, noGab = false;
  const fecha = () => { if (p) quiz.perguntas.push(p); p = null; alt = null; };
  for (const bruta of linhas) {
    const l = bruta.replace(/\*\*/g, "").trim(); let m;
    if (!l) continue;
    if ((m = l.match(/^#\s+(.*)$/))) { quiz.titulo = m[1].replace(/^quiz\s*[—–-]\s*/i, "").trim(); continue; }
    if (/^#{2,3}\s*gabarito/i.test(l)) { fecha(); noGab = true; continue; }
    if (noGab) { if ((m = l.match(/^(\d+)\s*[.)\-–—:]\s*\(?([A-Ea-e])\b/))) gab[+m[1]] = m[2].toUpperCase(); continue; }
    if ((m = l.match(/^#{2,4}\s*quest[aã]o\s*(\d+)\s*[:.)-]?\s*(.*)$/i))) { fecha(); p = { n: +m[1], enunciado: m[2] || "", opcoes: [] }; continue; }
    if (p && (m = l.match(/^\(?([A-Ea-e])[).]\s+(.*)$/))) { alt = { id: m[1].toUpperCase(), texto: m[2] }; p.opcoes.push(alt); continue; }
    if (/^#{2,4}\s/.test(l)) continue;
    if (p) { if (alt) alt.texto += " " + l; else p.enunciado += (p.enunciado ? " " : "") + l; }
  }
  fecha();
  const problemas = [];
  const perguntas = quiz.perguntas.map((q, i) => {
    const correta = gab[q.n || i + 1];
    if (q.opcoes.length !== 5) problemas.push(`questão ${i + 1}: ${q.opcoes.length} alternativas`);
    if (!correta) problemas.push(`questão ${i + 1}: sem gabarito`);
    return { enunciado: q.enunciado.trim(), opcoes: ["A", "B", "C", "D", "E"].map(L => (q.opcoes.find(o => o.id === L)?.texto || "").trim()), correta: correta || "" };
  });
  return { quiz: { titulo: quiz.titulo, tempoMinutos: quiz.tempoMinutos, perguntas }, problemas };
}
function exportarQuizzesMentor() {
  const quizzes = [], avisos = [];
  [1, 2, 3, 4].forEach(n => {
    const md = doc("quiz", n)?.conteudo;
    if (!md) return;
    const { quiz, problemas } = quizMdParaMentor(md, "Unidade " + n);
    if (quiz.perguntas.length > 10) avisos.push(`Unidade ${n}: ${quiz.perguntas.length} questões (o MENTOR aceita até 10)`);
    problemas.forEach(x => avisos.push(`Unidade ${n}, ${x}`));
    quizzes.push(quiz);
  });
  if (!quizzes.length) return toast("Nenhum quiz gerado ainda.");
  const d = S.d, slug = d.nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const dados = { formato: "mentor-quizzes", versao: 1, disciplina: d.nome, geradoEm: new Date().toISOString(), quizzes };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${slug}-quizzes-mentor.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(avisos.length ? "Arquivo gerado, mas confira: " + avisos.slice(0, 3).join("; ") : `Arquivo gerado com ${quizzes.length} quiz(zes).`);
}

/* ---------------- Markdown → HTML ---------------- */
const ALT = /^\s*[A-Ea-e][).]\s+\S/; // alternativas de quiz: A) ... E)
function mdBlocos(md) {
  const L = String(md || "").replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isTab = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < L.length) {
    let l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { out.push({ t: "h", n: m[1].length, x: m[2].trim() }); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push({ t: "hr" }); i++; continue; }
    if (isTab(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const linhas = [];
      while (i < L.length && isTab(L[i])) { linhas.push(L[i]); i++; }
      const rows = linhas.filter((r, k) => k !== 1).map(r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      out.push({ t: "tab", rows }); continue;
    }
    if (/^\s*>/.test(l)) {
      const q = []; while (i < L.length && /^\s*>/.test(L[i])) { q.push(L[i].replace(/^\s*>\s?/, "")); i++; }
      out.push({ t: "q", x: q.join(" ").trim() }); continue;
    }
    if (/^\s*[-*•]\s+/.test(l)) {
      const it = []; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])) { it.push(L[i].replace(/^\s*[-*•]\s+/, "")); i++; }
      out.push({ t: "ul", it }); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      const it = [], start = +l.match(/^\s*(\d+)/)[1];
      while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) { it.push(L[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      out.push({ t: "ol", it, start }); continue;
    }
    if (ALT.test(l)) { out.push({ t: "p", x: l.trim(), alt: true }); i++; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !ALT.test(L[i]) && !/^(#{1,4})\s|^\s*>|^\s*[-*•]\s+|^\s*\d+[.)]\s+/.test(L[i]) && !(isTab(L[i]) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1]))) { p.push(L[i].trim()); i++; }
    if (p.length) out.push({ t: "p", x: p.join(" ") }); else i++;
  }
  return out;
}
function inl(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
}
function mdHtml(md) {
  return mdBlocos(md).map(b => {
    if (b.t === "h") return `<h${b.n}>${inl(b.x)}</h${b.n}>`;
    if (b.t === "p") return b.alt ? `<p style="margin:0 0 6px 18px">${inl(b.x)}</p>` : `<p>${inl(b.x)}</p>`;
    if (b.t === "q") return `<blockquote>${inl(b.x)}</blockquote>`;
    if (b.t === "ul") return `<ul>${b.it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`;
    if (b.t === "ol") return `<ol start="${b.start}">${b.it.map(x => `<li>${inl(x)}</li>`).join("")}</ol>`;
    if (b.t === "hr") return "<hr>";
    if (b.t === "tab") return `<table>${b.rows.map((r, k) => `<tr>${r.map(c => k ? `<td>${inl(c)}</td>` : `<th>${inl(c)}</th>`).join("")}</tr>`).join("")}</table>`;
    return "";
  }).join("");
}

      if (tipo === "quizzes-aluno") partes = partes.map(semGabarito);

    }
    else if (tipo === "podcast") { partes = [conteudo("podcast", u)]; subtitulo = tituloDoc("podcast", u); nomeArq = "podcast-unidade-" + u; }
    else if (tipo === "podcasts") { partes = [1, 2, 3, 4].map(n => conteudo("podcast", n)).filter(Boolean); subtitulo = "Roteiros de podcast"; nomeArq = "podcasts"; }
    else if (tipo === "planos") { partes = [conteudo("planos", 0)]; subtitulo = "Planos de aula"; nomeArq = "planos-de-aula"; }
    else if (tipo === "trabalhos") { partes = [conteudo("trabalhos", 0)]; subtitulo = "Sugestões de trabalho final"; nomeArq = "trabalhos-finais"; }
    if (!partes.length) return toast("Nada para exportar ainda.");

  } catch (e) { toast("Erro ao gerar o Word: " + e.message, 6000); }
}
function semGabarito(md) { return String(md).split(/^##\s+Gabarito.*$/m)[0].trim(); }

async function montarDocx({ disciplina, subtitulo, partes, sumario }) {
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, Footer, PageNumber, ShadingType, LevelFormat } = docx;
  const NAVY = "0F1B33", GOLD = "B08A1E", FONTE = "Georgia";
  const runs = (s, base = {}) => {
    const out = [], re = /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g; let last = 0, m;

      if (m.index > last) out.push(new TextRun({ text: s.slice(last, m.index), ...base }));
      const tk = m[0];

      else out.push(new TextRun({ text: tk.slice(1, -1), italics: true, ...base }));
      last = m.index + tk.length;

    if (last < s.length) out.push(new TextRun({ text: s.slice(last), ...base }));

        out.push(new Paragraph({ heading: nivel, children: runs(b.x.replace(/\*\*/g, "")), pageBreakBefore: b.n === 1 && !(primeira && primeiroH1) }));
        if (b.n === 1) primeiroH1 = false;
      } else if (b.t === "p" && b.alt) out.push(new Paragraph({ children: runs(b.x), indent: { left: 360 }, spacing: { after: 60 } }));
      else if (b.t === "p") out.push(new Paragraph({ children: runs(b.x), alignment: AlignmentType.JUSTIFIED }));
      else if (b.t === "q") out.push(new Paragraph({ style: "Citacao", children: runs(b.x) }));
      else if (b.t === "ul") b.it.forEach(x => out.push(new Paragraph({ children: runs(x), bullet: { level: 0 }, spacing: { after: 80 } })));
      else if (b.t === "ol") {
        const ref = "num" + (numRef++);
        numberingConfig.push({ reference: ref, levels: [{ level: 0, format: LevelFormat.DECIMAL, text: "%1.", start: b.start || 1, alignment: AlignmentType.LEFT, style: { paragraph: { indent: { left: 540, hanging: 360 } } } }] });
        b.it.forEach(x => out.push(new Paragraph({ children: runs(x), numbering: { reference: ref, level: 0 }, spacing: { after: 80 } })));
      }
      else if (b.t === "hr") out.push(new Paragraph({ border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: "C9A227", space: 1 } }, spacing: { after: 200 } }));
      else if (b.t === "tab") {
        const nc = Math.max(...b.rows.map(r => r.length));

          width: { size: 100, type: WidthType.PERCENTAGE },

            tableHeader: k === 0,
            children: Array.from({ length: nc }, (_, c) => new TableCell({
              shading: k === 0 ? { type: ShadingType.CLEAR, fill: "F1E7C8", color: "auto" } : undefined,
              borders: { top: borda, bottom: borda, left: borda, right: borda },

              children: [new Paragraph({ spacing: { after: 0, line: 260 }, children: runs(r[c] || "", { size: 20, bold: k === 0 || undefined }) })]
            }))

        out.push(new Paragraph({ spacing: { after: 120 }, children: [] }));

    }
    return out;
  };
  // Capa
  const ano = new Date().getFullYear();
  const capa = [
    new Paragraph({ spacing: { before: 2200, after: 120 }, alignment: AlignmentType.CENTER, children: [new TextRun({ text: "ESCOLA MENTOR", font: FONTE, size: 36, bold: true, color: NAVY, characterSpacing: 60 })] }),
    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 120 }, children: [new TextRun({ text: "Ministério · Ensino · Teologia · Orientação", font: FONTE, size: 22, italics: true, color: GOLD })] }),
    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 1400 }, children: [new TextRun({ text: "CURSO TEOLÓGICO", font: FONTE, size: 20, color: "555555", characterSpacing: 80 })] }),
    new Paragraph({ alignment: AlignmentType.CENTER, border: { top: { style: BorderStyle.SINGLE, size: 12, color: "C9A227", space: 12 }, bottom: { style: BorderStyle.SINGLE, size: 12, color: "C9A227", space: 12 } }, spacing: { after: 300 },
      children: [new TextRun({ text: disciplina, font: FONTE, size: 56, bold: true, color: NAVY })] }),
    new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 2600 }, children: [new TextRun({ text: subtitulo, font: FONTE, size: 30, color: GOLD })] }),
    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "Igreja Vidas", font: FONTE, size: 24, bold: true, color: NAVY })] }),

  const documento = new Document({
    creator: "MENTOR Currículo", title: `${disciplina} — ${subtitulo}`,

/* ---------------- Ajustes ---------------- */
function abrirAjustes() {
  if (!S.user) return;
  const temChave = !!ls.get("mc_anthropic_key");
  modal(`<h3>Ajustes</h3><div class="stack">
    <div class="note">Versão instalada: <b>v${APP_VERSION}</b> <span id="ajVer" class="muted"></span></div>
    <div class="row"><button class="btn sm" onclick="atualizarApp()">↻ Atualizar app</button><button class="btn sm danger" onclick="sairConta()">Sair da conta (${esc(S.user.email)})</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div><label class="f">Chave da API da Anthropic <span class="muted">(fica só neste aparelho)</span></label>
      <input type="password" id="ajK" placeholder="${temChave ? "•••••••• (já salva; cole outra para trocar)" : "sk-ant-..."}">
      <div class="muted small">Pegue em console.anthropic.com → API Keys.</div></div>
    <details><summary class="small" style="cursor:pointer">Usar um Worker do Cloudflare em vez da chave (opcional)</summary>
      <div class="stack" style="margin-top:10px">
      <div><label class="f">Endereço do Worker</label><input type="text" id="ajW" value="${esc(ls.get("mc_worker_url", ""))}" placeholder="https://mentor-curriculo.SEU-USUARIO.workers.dev"></div>
      <div><label class="f">Senha do Worker</label><input type="password" id="ajWT" value="${esc(ls.get("mc_worker_token", ""))}"></div>
      <div class="muted small">Se o Worker estiver preenchido, o app usa ele e ignora a chave acima.</div></div></details>
    <div><label class="f">Cotação do dólar <span class="muted">(opcional, para ver os custos também em reais)</span></label>
      <input type="text" id="ajD" inputmode="decimal" value="${esc(ls.get("mc_dolar", ""))}" placeholder="Ex.: 5,40"></div>
    <div><label class="f">Modelo da IA</label><select id="ajM">${MODELOS.map(m => `<option value="${m.id}" ${S.cfg.modelo === m.id ? "selected" : ""}>${m.nome}</option>`).join("")}</select></div>
    <div><label class="f">Bibliografia padrão da Escola MENTOR <span class="muted">(uma obra por linha; vale para todas as disciplinas)</span></label>
      <textarea id="ajB" style="min-height:140px">${esc(S.cfg.bibliografia_padrao || "")}</textarea></div>
    <details><summary class="small" style="cursor:pointer">Perfil teológico e pedagógico usado pela IA</summary>
      <textarea id="ajP" style="min-height:260px;margin-top:8px;font-size:14px">${esc(S.cfg.perfil || PERFIL_PADRAO)}</textarea>
      <button class="btn sm" style="margin-top:6px" onclick="$('#ajP').value=PERFIL_PADRAO">Restaurar o padrão</button></details>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>Fechar</button><button class="btn pri" data-ok>Salvar ajustes</button></div>
  </div>`, (m, close) => {
    verificarVersao().then(v => { const el = $("#ajVer", m); if (el) el.textContent = v ? (v === APP_VERSION ? "· é a mais recente" : "· publicada: v" + v) : ""; });
    $("[data-x]", m).onclick = close;
    $("[data-ok]", m).onclick = async () => {
      const k = $("#ajK", m).value.trim(); if (k) ls.set("mc_anthropic_key", k);
      const w = $("#ajW", m).value.trim(); w ? ls.set("mc_worker_url", w) : ls.del("mc_worker_url");
      ls.set("mc_worker_token", $("#ajWT", m).value);
      ls.set("mc_dolar", $("#ajD", m).value.trim());
      const campos = { bibliografia_padrao: $("#ajB", m).value.trim(), perfil: $("#ajP", m).value.trim() || PERFIL_PADRAO, modelo: $("#ajM", m).value, updated_at: new Date().toISOString() };
      const { error } = await S.sb.from("mc_config").upsert({ user_id: S.user.id, ...campos });
      if (error) return toast("Erro: " + traduzErro(error.message));
      Object.assign(S.cfg, campos); close(); toast("Ajustes salvos ✓");
      if (S.d) render(); else irInicio();
    };
  });
}

window.addEventListener("beforeunload", e => { if (S.busy) { e.preventDefault(); e.returnValue = ""; } });
iniciar();
</script>
